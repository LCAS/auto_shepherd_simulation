schemaVersion: '2.0.0'

metadataTest:
  - env:
      - key: 'UNITY_VERSION'
        value: '2022.3.18f1'

fileExistenceTests:
  - name: 'Check Unity Editor exists'
    path: '/opt/Unity/Editor/Unity'
    shouldExist: true
    permissions: '-rwxr-xr-x'

  - name: 'Check test script exists'
    path: '/app/Assets/Scripts/tests/TestRosInterface.cs'
    shouldExist: true
    permissions: '-rw-r--r--'

commandTests:
  - name: 'Check Unity version'
    command: '/opt/Unity/Editor/Unity'
    args: ['--version']
    expectedOutput: ['.*2022.3.18f1.*']

  - name: 'Check Unity test runner'
    command: '/opt/Unity/Editor/Unity'
    args: ['-batchmode', '-nographics', '-executeMethod', 'UnityEditor.TestTools.TestRunner.Api.TestRunnerApi.ExecuteTests']
    exitCode: 0 
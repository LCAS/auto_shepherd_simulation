session: simulator
init_cmd: |
  echo " "
  echo " "
  echo " "
  echo "Running Initialisation" | awk '{ gsub("Running Initialisation", "\033[1;21m\033[1;30m&\033[0m"); print }' ;

  #exec /bin/bash
  cd @TMULE_CONFIG_DIR@ || true
  set -o pipefail
  function export_default () {
    var_name="$1"
    var_default="$2"
    eval $var_name="${!var_name:-$var_default}"
    export $var_name
    echo "  $0 -> $var_name=${!var_name}"
  }

windows:
  - name: mapper
    tags: ["viz", "mapper"]
    panes:
      - "ros2 run auto_shepherd_simulation mapper.py"
      # - "rviz2"
  - name: simulator
    tags: ["ros_interface", "dog_control_simulator", "dog_control"]
    panes:
      - ros2 run auto_shepherd_simulation ros_interface.py
      - ros2 run auto_shepherd_simulation dog_control_simulator.py
      - ros2 run auto_shepherd_simulation dog_control.py

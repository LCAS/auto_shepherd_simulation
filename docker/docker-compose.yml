services:
  auto_shepherd_simulation_ros2_humble:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-shepherd-simulation-ros2-humble
    stdin_open: true
    tty: true
    command: /bin/bash
    network_mode: host

    privileged: true
    devices:
      - /dev:/dev

    # — Bind‑mount each git sub‑module into the workspace ————————————
    volumes:
      - ../auto_shepherd_simulation:/home/ros/base_ws/src/auto_shepherd_simulation:rw

      # Bash Scripts
      - ../bash_scripts/container:/home/ros/bash_scripts:rw

      # enable mount for gui applications
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../configs/rviz:/home/ros/.rviz2:rw
      - ../configs/map:/home/ros/map:rw

    environment:
      - BASE_WS=/home/ros/base_ws
      - DISPLAY=${HOST_DISPLAY_VAR:-:0}
      - QT_X11_NO_MITSHM=1

session: simulator
init_cmd: |
  echo " "
  echo " "
  echo " "
  echo "Running Initialisation"

  #exec /bin/bash
  cd @TMULE_CONFIG_DIR@ || true
  set -o pipefail

windows:
  - name: data_loader
    panes:
      - ros2 run auto_shepherd_simulation_ros2 mapper.py

  - name: visuals
    panes:
      - rviz2

  - name: simulator
    panes:
      - ros2 run auto_shepherd_simulation_ros2 ros_interface.py
      - ros2 run auto_shepherd_simulation_ros2 dog_control_simulator.py
      - ros2 run auto_shepherd_simulation_ros2 dog_control.py

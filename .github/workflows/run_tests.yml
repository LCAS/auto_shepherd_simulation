name: Run Tests

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  unity-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
      
      - name: Verify Unity Project Structure
        run: |
          # Check if essential Unity project files exist
          if [ ! -f "ShepSim/ProjectSettings/ProjectVersion.txt" ]; then
            echo "Error: ProjectVersion.txt not found in ShepSim directory. Invalid Unity project structure."
            exit 1
          fi
          
          if [ ! -d "ShepSim/Assets" ]; then
            echo "Error: Assets folder not found in ShepSim directory. Invalid Unity project structure."
            exit 1
          fi
          
          if [ ! -d "ShepSim/Packages" ]; then
            echo "Error: Packages folder not found in ShepSim directory. Invalid Unity project structure."
            exit 1
          fi
          
          echo "Unity project structure verification passed."
          cat ShepSim/ProjectSettings/ProjectVersion.txt

  ros-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Build ROS Test Container
        run: |
          cd ros_interface
          docker build -t ros_test -f Dockerfile.test .
          
      - name: Run ROS Tests
        run: docker run ros_test 
name: Run Tests

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  unity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
      
      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: ShepSim/Library
          key: Library-${{ github.sha }}
          restore-keys: |
            Library-

      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ShepSim
          unityVersion: 2022.3.18f1
          testMode: EditMode
          customParameters: -buildTarget StandaloneLinux64

  ros-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Build ROS Test Container
        run: |
          cd ros_interface
          docker build -t ros_test -f Dockerfile.test .
          
      - name: Run ROS Tests
        run: docker run ros_test 